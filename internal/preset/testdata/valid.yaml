name: pair-review
description: Claude plans, Kimi executes, Claude reviews.
roles:
  - id: planner
    runtime: claude
    model: opus
  - id: executor
    runtime: kimi
    model: kimi-k2
routing: handoff_then_round_robin
budget:
  max_turns: 20
  max_tokens: 400000
  deadline_minutes: 60
exit_when:
  - tests_pass
  - reviewer_approved
scratch:
  max_kb: 64
  summarize_with: claude-haiku
