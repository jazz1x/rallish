name: pair-review
description: Planner, executor, and reviewer roles cycling in a structured review loop.

roles:
  - id: planner
    runtime: claude
    model: opus
  - id: executor
    runtime: kimi
    model: kimi-k2
  - id: reviewer
    runtime: claude
    model: sonnet

routing: handoff_then_round_robin

budget:
  max_turns: 20
  max_tokens: 400000
  deadline_minutes: 60
  dry_rounds_threshold: 3

exit_when:
  - tests_pass
  - reviewer_approved
  - turns_exhausted
  - dry_rounds

scratch:
  max_kb: 64
  summarize_with: claude-haiku
