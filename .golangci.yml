run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - forbidigo
    - gosec
    - revive
    - gocritic

linters-settings:
  forbidigo:
    forbid:
      - p: "^os\\.Environ\\(\\)$"
        msg: "do not use os.Environ(); construct a minimal allowlist instead"
      - p: 'exec\.Command\("sh"'
        msg: "do not use exec.Command with sh; use literal arg slices instead"
      - p: 'exec\.Command\("bash"'
        msg: "do not use exec.Command with bash; use literal arg slices instead"
      - p: 'exec\.Command\("zsh"'
        msg: "do not use exec.Command with zsh; use literal arg slices instead"

output:
  formats:
    - format: colored-line-number

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
