version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - gocritic
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: "^os\\.Environ$"
          msg: "use the env allowlist via the adapter envList, not full os.Environ"
        - pattern: "^exec\\.Command\\(\"(sh|bash|zsh)\""
          msg: "do not shell-out to sh/bash/zsh; invoke binaries directly"
      analyze-types: false
      exclude-godoc-examples: true
  exclusions:
    paths:
      - .toolchain

output:
  formats:
    text:
      path: stdout

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
