version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25"
  exclude-dirs:
    - .toolchain

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - gocritic
output:
  formats:
    text:
      path: stdout

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
