pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: gofmt -l {staged_files}
      fail_text: "Go files are not formatted. Run 'gofmt -w {staged_files}' to fix."
    go-vet:
      run: go vet ./...
      fail_text: "go vet found issues. Please fix them before committing."
    go-test:
      run: go test ./... -race -count=1
      fail_text: "Tests failed. Please fix failing tests before committing."
    go-lint:
      run: golangci-lint run --timeout=5m
      fail_text: "Linting failed. Please fix linting issues before committing."
