pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: gofmt -l {staged_files}
      fail_text: "Go files are not formatted. Run 'gofmt -w {staged_files}' to fix."
    go-vet:
      run: go vet ./...
      fail_text: "go vet found issues. Please fix them before committing."
    go-test:
      run: go test ./... -race -count=1
      fail_text: "Tests failed. Please fix failing tests before committing."
    go-lint:
      run: PATH="$PWD/.toolchain/go/bin:$PWD/.toolchain/bin:$PATH" golangci-lint run --timeout=5m
      fail_text: "Linting failed. Please fix linting issues before committing."
    no-raw-ansi:
      glob: "*.go"
      run: bash scripts/check-no-raw-ansi.sh
      fail_text: "Raw ANSI escape detected outside internal/ui. Use ui.Theme instead."

# Reject commit messages that don't use a conventional-commits prefix (see
# AGENTS.md §Commit Messages). Merge/Revert messages from git are allowed.
commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|refactor|docs|test|chore|sec|ci|build|perf|style)(\(.+\))?: ' && exit 0
        head -1 {1} | grep -qE '^(Merge|Revert)' && exit 0
        echo "❌ commit subject must start with a conventional prefix:" >&2
        echo "   feat: fix: refactor: docs: test: chore: sec: ci: build: perf: style:" >&2
        echo "   (optional scope in parens, e.g. feat(rally): ...)" >&2
        echo "   see AGENTS.md §Commit Messages" >&2
        exit 1
      fail_text: "use a conventional-commits prefix on the subject line"

# Belt-and-braces before push: build + vet + race tests + supply-chain
# integrity check. Catches tampering in the module cache (go.sum already
# hashes deps; this asserts the verify step runs at push time).
#
# Each command prepends the repo-pinned .toolchain to PATH (same as the
# pre-commit go-lint hook and scripts/check-all.sh) so the vendored Go
# matching go.mod is used — not whatever `go` happens to be on the system
# PATH — and so the hooks run even on machines with no system Go.
pre-push:
  parallel: true
  commands:
    build:
      run: PATH="$PWD/.toolchain/go/bin:$PWD/.toolchain/bin:$PATH" go build ./...
      fail_text: "go build failed — push aborted"
    vet:
      run: PATH="$PWD/.toolchain/go/bin:$PWD/.toolchain/bin:$PATH" go vet ./...
      fail_text: "go vet failed — push aborted"
    test:
      run: PATH="$PWD/.toolchain/go/bin:$PWD/.toolchain/bin:$PATH" go test ./... -race -count=1
      fail_text: "race tests failed — push aborted"
    mod-verify:
      run: PATH="$PWD/.toolchain/go/bin:$PWD/.toolchain/bin:$PATH" go mod verify
      fail_text: "go mod verify failed — module cache tampered or go.sum mismatch; run 'go clean -modcache && go mod download' to restore"
    # Secret scan before push. Skip-if-absent (not a hard dependency): if gitleaks
    # is not installed locally the hook prints how to get it and passes — the CI
    # `gitleaks` job is the always-on gate. Only a real finding (gitleaks exit
    # code 1) aborts the push; a usage/version error does NOT block (it warns and
    # passes, so a CLI-flag drift can never permanently wedge pushes — CI remains
    # authoritative). --no-banner --redact keeps output quiet and never echoes a
    # secret. `gitleaks detect` is the invocation common to all 8.x releases.
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "ℹ gitleaks not installed — skipping local secret scan (CI still enforces it). Install: brew install gitleaks"
          exit 0
        fi
        gitleaks detect --source . --redact --no-banner
        code=$?
        if [ "$code" -eq 1 ]; then
          echo "❌ gitleaks found a potential secret — push aborted (finding above, value redacted)"
          exit 1
        fi
        if [ "$code" -ne 0 ]; then
          echo "ℹ gitleaks exited $code (not a finding — likely a CLI/flag mismatch). CI gitleaks remains authoritative; not blocking push."
        fi
        exit 0
      fail_text: "gitleaks found a potential secret — push aborted"
